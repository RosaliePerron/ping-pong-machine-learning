services:
  labeler:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./data:/data
      - ../videos:/data/videos
      - ${REPO_DIR:-..}:/repo:ro  # label_ball.py (frame picking), ball_speed.py + models/ (debug videos)
      - ${REPO_DIR:-..}/runs:/repo/runs  # ball_speed.py outputs; debug videos are written here
    restart: unless-stopped
