services:
  labeler:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./data:/data
      - ../videos:/data/videos
      # label_ball.py (frame picking), ball_speed.py (debug videos into runs/), train_ball.py (writes labels.csv, models/)
      - ${REPO_DIR:-..}:/repo
    restart: unless-stopped
    deploy:  # GPU for debug videos and training; needs nvidia-container-toolkit. Remove this block to run them on CPU.
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
