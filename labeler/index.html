<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame Labeler</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 16px; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 1.2rem; margin: 0; }
  table { border-collapse: collapse; }
  td, th { padding: 4px 12px; text-align: left; }
  #stage { position: relative; display: inline-block; max-width: 100%; }
  #frame { display: block; max-width: 100%; cursor: crosshair; }
  #mark { position: absolute; width: 16px; height: 16px; margin: -9px 0 0 -9px; border: 2px solid red;
          border-radius: 50%; pointer-events: none; display: none; }
  #status { font-variant-numeric: tabular-nums; }
  .hidden { display: none; }
  kbd { border: 1px solid; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<header>
  <h1><a href="#" onclick="showList(); return false">Frame Labeler</a></h1>
  <label>Your name <input id="who" size="12"></label>
  <a href="/api/labels.csv">Download labels.csv</a>
</header>

<section id="list">
  <form id="upload">
    <input type="file" name="file" accept="video/*" required>
    <button>Upload video</button> <span id="upmsg"></span>
  </form>
  <table><thead><tr><th>Video</th><th>Frames</th><th>Labelled</th></tr></thead><tbody id="videos"></tbody></table>
</section>

<section id="labeler" class="hidden">
  <p id="status"></p>
  <p>
    Click the ball. <kbd>n</kbd> / right click: not visible. <kbd>←</kbd><kbd>→</kbd>: prev/next frame.
    <kbd>r</kbd>: random unlabelled frame. <kbd>Del</kbd>: clear label.
    Go to frame <input id="goto" type="number" min="0" style="width: 7em">
  </p>
  <div id="stage"><img id="frame" alt="video frame"><div id="mark"></div></div>
</section>

<script>
const $ = id => document.getElementById(id);
let video = null, total = 0, frame = 0, labels = {};

$('who').value = (() => { try { return localStorage.who || ''; } catch { return ''; } })();
$('who').onchange = () => { try { localStorage.who = $('who').value; } catch {} };

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

async function showList() {
  video = null;
  $('labeler').classList.add('hidden'); $('list').classList.remove('hidden');
  const vids = await api('/api/videos');
  $('videos').replaceChildren(...vids.map(v => {
    const tr = document.createElement('tr');
    const a = Object.assign(document.createElement('a'), { href: '#', textContent: v.name });
    a.onclick = e => { e.preventDefault(); open(v.name, v.frames); };
    tr.append(...[a, v.frames, v.labeled].map(x => { const td = document.createElement('td'); td.append(x); return td; }));
    return tr;
  }));
}

$('upload').onsubmit = async e => {
  e.preventDefault();
  $('upmsg').textContent = 'uploading…';
  try {
    await api('/api/videos', { method: 'POST', body: new FormData(e.target) });
    $('upmsg').textContent = 'done'; e.target.reset(); showList();
  } catch (err) { $('upmsg').textContent = err.message; }
};

async function open(name, frames) {
  video = name; total = frames;
  labels = await api(`/api/videos/${encodeURIComponent(name)}/labels`);
  $('list').classList.add('hidden'); $('labeler').classList.remove('hidden');
  await randomFrame();
}

function show(f) {
  frame = Math.max(0, Math.min(total - 1, f));
  $('frame').src = `/api/videos/${encodeURIComponent(video)}/frames/${frame}.jpg`;
  $('goto').value = frame;
  render();
  // warm the browser cache for the next frame
  new Image().src = `/api/videos/${encodeURIComponent(video)}/frames/${frame + 1}.jpg`;
}

function render() {
  const l = labels[frame], img = $('frame'), mark = $('mark');
  const state = !l ? 'unlabelled' : l.visible ? `ball at ${l.x.toFixed(0)}, ${l.y.toFixed(0)}` : 'not visible';
  $('status').textContent = `${video} · frame ${frame} / ${total - 1} · ${state}` +
    (l?.labeler ? ` (by ${l.labeler})` : '') + ` · ${Object.keys(labels).length} labelled`;
  if (l?.visible && img.naturalWidth) {
    const s = img.clientWidth / img.naturalWidth;
    mark.style.left = l.x * s + 'px'; mark.style.top = l.y * s + 'px'; mark.style.display = 'block';
  } else mark.style.display = 'none';
}
$('frame').onload = render;
addEventListener('resize', render);

async function save(label) {
  const f = frame;
  label.labeler = $('who').value;
  await api(`/api/videos/${encodeURIComponent(video)}/labels/${f}`,
    { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(label) });
  labels[f] = label;
  show(f + 1);
}

async function randomFrame() {
  try { show((await api(`/api/videos/${encodeURIComponent(video)}/random`)).frame); }
  catch (err) { show(0); $('status').textContent += ` · ${err.message}`; }
}

$('frame').onclick = e => {
  const img = e.target, s = img.naturalWidth / img.clientWidth;
  save({ visible: true, x: e.offsetX * s, y: e.offsetY * s });
};
$('frame').oncontextmenu = e => { e.preventDefault(); save({ visible: false }); };
$('goto').onchange = e => show(+e.target.value);

addEventListener('keydown', async e => {
  if (!video || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') show(frame + 1);
  else if (e.key === 'ArrowLeft') show(frame - 1);
  else if (e.key === 'n') save({ visible: false });
  else if (e.key === 'r') randomFrame();
  else if (e.key === 'Delete' || e.key === 'Backspace') {
    await api(`/api/videos/${encodeURIComponent(video)}/labels/${frame}`, { method: 'DELETE' });
    delete labels[frame]; render();
  }
});

showList();
</script>
</body>
</html>
